# 
# update the films.sc spreadsheet when the films_to_ad.txt file changes
#


name: update films.sc with films_to_add.txt data

on:
  push:
    paths:
      - "films_to_add.txt"    # only triggered when this file changes

permissions:
  contents: write   # allows job to write .sc file back to repo

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install sc-im
        run: sudo apt-get update && sudo apt-get install -y sc-im

      - name: check sc-im version
        run: cat sc-im --version

      - name: export films.sc to a csv file
        run: |
          # use script to simulate terminal env on runner and get sc-im to run commands
          script -qec "sc-im --quite --quit_afterload --nocurses --export_csv films.sc > /tmp/films.csv" /dev/null

      - name: check csv
        run: cat /tmp/films.csv

      - name: build sc-im commands
        run: |
           python3 - <<'EOF' > /tmp/scim_cmds_script.txt
           COLUMN_ID = "B"   # column that contains IDs
           COLUMN_TITLE = "C"   # column that containes titles
           ID_OFFSET = -2   # ID offset relative to row index
           FILMS_START_ROW_INDEX = 3

           # parse the spreadsheet data
           with open("/tmp/films.csv", "r") as f:
              lines = [l.strip() for l in f]

           # check for blank lines after where films start which affect id offset
           for line in lines[FILMS_START_ROW_INDEX:]:
              if not line:
                  ID_OFFSET += -1

           # index of row to start writing to
           next_row = len(lines)

           # parse titles to add
           with open("films_to_add.txt", "r") as f:
              titles = [t.strip() for t in f if t.strip()]

           # clear the titles to add
           with open("films_to_add.txt", "w") as f:
              pass

           # write commands
           for title in titles:
              cleaned_title = title.replace('"', '\\"')
              print(f'LEFTSTRING {COLUMN_ID}{next_row} = "{next_row + ID_OFFSET}"')
              print(f'LEFTSTRING {COLUMN_TITLE}{next_row} = "{cleaned_title}"')
              next_row += 1

           EOF

      - name: check commands
        run: cat /tmp/scim_cmds_script.txt

      - name: apply commands to sheet
        run: |
          # gets last byte of films.sc (tail -c1), strips new lines ("$(...)")  and checks if its non empty (-n)
          # if it is non empty (left side evaluaates to true) add a new line (echo)
          [ -n "$(tail -c1 films.sc)" ] && echo >> films.sc
          cat /tmp/scim_cmds_script.txt >> films.sc
          git diff films.sc

      - name: export films.sc to a .csv with updated data
        run: script -qec "sc-im --quite --quit_afterload --nocurses --export_csv films.sc > /tmp/films.csv" /dev/null

      - name: generaate a .md file containing a table
        run: |
          python3 - <<'EOF' > /tmp/markdown_table.md
          import csv

          HEADER_ROW_INDEX = 2
          FILMS_START_ROW_INDEX = HEADER_ROW_INDEX + 1

          with open("/tmp/films.csv", newline='') as f:
            # list of strings as rows
            rows = list(csv.reader(f, delimiter=',', quotechar='"'))

            # build and print header row
            headers = rows[HEADER_ROW_INDEX]
            print("| ", end="")
            print(" | ".join(headers), end="")
            print(" |")

            # build and print diving row between headers and content
            dividing_row = ["----"] * len(headers)
            print("| ", end="")
            print(" | ".join(dividing_row), end="")
            print(" |")

            # build and print content rows
            for line in row[FILMS_START_ROW_INDEX:]:
              print("| ", end="")
              print(" | ".join(content), end="")
              print(" |")

          EOF

      - name: check .md file
        run: cat /tmp/markdown_table.md

      - name: update README.md with markdow_table.md
        run: cat /tmp/markdown_table.md > README.md

      - name: Commit updated spreadsheet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add films.sc
          git add films_to_add.txt
          git add README.md
          git diff --cached --quiet || git commit -m "Update films.sc from films_to_add.txt"
          git push

